name: Spec drift

# Compares Ideogram's live OpenAPI specification with the committed snapshot (spec/openapi.json) on the operations this
# server may expose (scripts/spec-pull.mjs: added, removed, or changed in itself or in a schema it references), weekly
# and by hand. Drift opens ONE issue labelled spec-drift, or updates the open one with the new list; no drift leaves an
# open issue as it is (a maintainer closes it with the snapshot update). The build never depends on this job: CI is tied
# to the committed snapshot. A specification that cannot be read ends the run red and opens nothing.
# The GitHub token goes to api.github.com only (through gh); the specification is read without credentials.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: spec-drift
  cancel-in-progress: false

env:
  LABEL: spec-drift
  TITLE: "Ideogram API specification drift"

jobs:
  drift:
    name: Compare the live specification with the snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Drift of the exposed operations
        id: pull
        run: |
          set -uo pipefail # the exit code is the answer: 0 none, 1 drift, 2 unreadable — read, never left to bash -e
          code=0
          node scripts/spec-pull.mjs > "$RUNNER_TEMP/drift.md" || code=$?
          cat "$RUNNER_TEMP/drift.md"
          case "$code" in
            0) echo "::notice::no drift" ;;
            1) echo "drift=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::the live specification could not be compared (exit $code)"; exit 1 ;;
          esac

      - name: Open or update the one drift issue
        if: steps.pull.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # the label exists after the first run; any other failure surfaces below, where the issue needs the label
          gh label create "$LABEL" --repo "$REPO" --color d93f0b --description "The live API specification differs from the snapshot" 2> /dev/null || true
          number="$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number --jq '.[0].number // ""')"
          if [ -z "$number" ]; then
            gh issue create --repo "$REPO" --title "$TITLE" --label "$LABEL" --body-file "$RUNNER_TEMP/drift.md"
          else
            gh issue edit "$number" --repo "$REPO" --body-file "$RUNNER_TEMP/drift.md"
            echo "::notice::updated issue #$number"
          fi
